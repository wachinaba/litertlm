name: Android checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Generate Android example runner
        run: |
          mkdir -p example/assets/audio example/assets/images example/assets/models
          flutter create --platforms=android --project-name=litertlm_example --org=org.rockstudio example
      - name: Compile Android bridge
        working-directory: example
        run: flutter build apk --debug
